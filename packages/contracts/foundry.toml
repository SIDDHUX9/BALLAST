[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
invariant = { runs = 12, depth = 4 }

[rpc_endpoints]
matsnet = "${MATSNET_RPC_URL}"

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 15 }
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
