name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Foundry Contracts Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build Contracts
        run: |
          cd packages/contracts
          forge --version
          forge build --sizes

      - name: Run Contract Unit & Fuzz Tests
        run: |
          cd packages/contracts
          forge test --profile ci

  typescript:
    name: TypeScript Checks, Lint, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Shared & Keeper
        run: |
          pnpm --filter @ballast/shared build
          pnpm --filter @ballast/keeper build

      - name: Build Web Production Bundle
        run: pnpm --filter @ballast/web build

      - name: Rule 2 Verification (No Test Doubles in Production Web Bundle)
        run: node scripts/check-clean-bundle.js
